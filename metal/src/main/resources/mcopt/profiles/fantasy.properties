# Fantasy look for Minecraft Metal Shaders.
# Select with profile=fantasy in config/mcopt.properties. Command-line -Dmcopt.* flags
# and explicit mcopt.* settings in config/mcopt.properties still take precedence.
#
# This is an aesthetic profile, not a performance preset: keep mcopt's own terrain renderer
# enabled so the Metal shaders have terrain to light.
mcopt.own=true
mcopt.shade=true
mcopt.shade.look=fantasy
mcopt.shade.preset=balanced

# Painterly finish. The structure-tensor and Kuwahara passes are skipped completely at 0.
mcopt.shade.fantasy.painterly=0.35
mcopt.shade.fantasy.brush=3.0
mcopt.shade.fantasy.grain=0.35
mcopt.shade.fantasy.paintFade=96

# Soft sunlight, lifted violet-blue shade, and broad, coloured torch pools.
mcopt.shade.fantasy.softness=0.85
mcopt.shade.fantasy.shadowTint=0.55
mcopt.shade.fantasy.blockLight=0.5
mcopt.shade.fantasy.sunColor=1.0
mcopt.shade.fantasy.mist=1.0

# Complement the existing volumetric atmosphere and HDR bloom with a brighter turquoise water palette.
mcopt.shade.water.color=turquoise
mcopt.shade.user.bloom=1.1
